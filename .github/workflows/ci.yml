name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: ./global.json

      - name: Restore dependencies
        run: dotnet restore AdventOfCode.slnx

      - name: Build
        run: dotnet build AdventOfCode.slnx --configuration Release --no-restore

      - name: Run tests without personal input
        run: dotnet test AdventOfCode.slnx --configuration Release --no-build --filter "Category!=RealInput"
